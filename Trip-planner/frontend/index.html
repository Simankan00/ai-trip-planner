<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your AI Travel Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-wrapper">
        <header class="header">
            <h1>Your AI Travel Planner</h1>
            <p>Tell us about your trip and get a personalized itinerary in seconds.</p>
        </header>

        <div class="card">
            <h2>Plan a new trip</h2>
            <form id="travelForm">
                <div class="form-grid">
                    <!-- Row 1 -->
                    <div class="input-group">
                        <label for="source">Source</label>
                        <input type="text" id="source" placeholder="e.g. New York" required>
                    </div>
                    <div class="input-group">
                        <label for="destination">Destination</label>
                        <input type="text" id="destination" placeholder="e.g. Tokyo" required>
                    </div>
                    
                    <!-- Row 2 -->
                    <div class="input-group">
                        <label for="startDate">Start date</label>
                        <input type="date" id="startDate" required>
                    </div>
                    <div class="input-group">
                        <label for="endDate">End date</label>
                        <input type="date" id="endDate" required>
                    </div>

                    <!-- Row 3 -->
                    <div class="input-group">
                        <label for="budget">Budget</label>
                        <input type="text" id="budget" placeholder="e.g. $2000 USD">
                    </div>
                    <div class="input-group">
                        <label for="travelers">Number of travelers</label>
                        <input type="number" id="travelers" value="2" min="1">
                    </div>

                    <!-- Row 4 -->
                    <div class="input-group full-width">
                        <label for="interests">Interests</label>
                        <textarea id="interests" rows="3" placeholder="e.g. food, hiking, museums, nightlife"></textarea>
                    </div>
                </div>

                <button type="submit" id="generateBtn">Generate itinerary</button>
            </form>
        </div>

        <!-- This container is hidden until the user clicks Generate -->
        <div id="resultsContainer" class="card hidden">
            <h3 id="statusText"></h3>
            <div id="aiResponse" class="ai-response-content"></div>
            <div id="deepLinksContainer" class="deep-links-grid"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
